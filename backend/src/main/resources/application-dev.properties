# ===================================================================
# 1. DATABASE CONFIGURATION (MySQL)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3309/executr_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# 2. JPA / HIBERNATE CONFIGURATION
# ===================================================================
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# 3. CUSTOM JWT CONFIGURATION (Auth)
# ===================================================================
# Default fallback key provided for local dev only. Override in prod!
app.jwt.secret=${JWT_SECRET:your_super_secret_local_dev_key_make_it_very_long_12345!}
# JWT Expiration time in milliseconds (default: 86400000 ms = 24 hours)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# 4. GOOGLE OAUTH2 CONFIGURATION
# ===================================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:default-client-id.apps.googleusercontent.com}

# ===================================================================
# 5. Profile and Default Spring Security Password Override
# ===================================================================
spring.security.user.name=${ADMIN_USERNAME:vishal}
spring.security.user.password=${ADMIN_USER_PASSWORD:2005}

# ===================================================================
# 6. Admin Settings
# ===================================================================
app.security.admin-email=${ADMIN_EMAIL:vishal@yourdomain.com}